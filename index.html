<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>Expense Tracker</h1>
        <p class="subtitle">Log Expenses</p>
    </header>
    <main class="container">
        <section class="card">
            <h2>Add an Expense</h2>
            <form id="expense-form" class="expense-form">
                <div class="field field-wide">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Lunch" required>
                </div>
                <div class="field">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
                </div>
                <div class="field">
                    <label for="currency">Currency</label>
                    <select id="currency"></select>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <select id="category"></select>
                </div>
                <button type="submit" class="btn btn-primary">Add expense</button>
            </form>
            <p id="form-error" class="form-error" role="alert"></p>
    </section>
    <section class="card controls">
      <div class="field">
        <label for="home-currency">Home currency</label>
        <select id="home-currency"></select>
      </div>
      <div class="field">
        <label for="category-filter">Show category</label>
        <select id="category-filter"></select>
      </div>
      <div class="total">
        <span class="total-label">Total</span>
        <span id="total-amount" class="total-amount">0.00</span>
      </div>
    </section>
    <section class="card">
      <h2>Your expenses</h2>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-message" class="empty-message">No expenses yet. Add one above.</p>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
    </main>
</body>
</html>
